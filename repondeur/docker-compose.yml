services:
  asterisk:
    build:
      context: .
      dockerfile: ai-agent/Dockerfile
    image: depanmagic-asterisk-ai:latest
    container_name: depanmagic-asterisk
    restart: unless-stopped
    network_mode: host  # SIP/RTP fonctionnent mal en bridge à cause du NAT
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Trunk OVH + dialplan ---
      OVH_SIP_USERNAME: ${OVH_SIP_USERNAME}
      OVH_SIP_PASSWORD: ${OVH_SIP_PASSWORD}
      EXTERNAL_IP: ${EXTERNAL_IP}
      TECH_MOBILE: ${TECH_MOBILE}
      EXT_100_PASSWORD: ${EXT_100_PASSWORD}
      AMI_PASSWORD: ${AMI_PASSWORD}
      VM_PIN_100: ${VM_PIN_100}
      VM_PIN_101: ${VM_PIN_101}
      VM_PIN_102: ${VM_PIN_102}
      VM_PIN_103: ${VM_PIN_103}
      VM_EMAIL_ACCUEIL: ${VM_EMAIL_ACCUEIL}
      VM_EMAIL_DEVIS: ${VM_EMAIL_DEVIS}
      VM_EMAIL_SUIVI: ${VM_EMAIL_SUIVI}
      VM_EMAIL_URGENCE: ${VM_EMAIL_URGENCE}
      # --- AI Agent ---
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-7}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-ThT5KcBeYPX3keUQqHPh}
      PG_DSN: postgresql://depanmagic:${PG_PASSWORD}@postgres:5432/depanmagic
    volumes:
      - ./asterisk:/etc/asterisk-templates:ro
      - ./sounds/custom:/var/lib/asterisk/sounds/custom:ro
      - ./ai-agent/knowledge:/opt/ai-agent/knowledge:ro
      - asterisk-spool:/var/spool/asterisk
      - asterisk-logs:/var/log/asterisk
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    command: ["asterisk", "-fvvv"]

  postgres:
    image: postgres:16-alpine
    container_name: depanmagic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: depanmagic
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: depanmagic
    volumes:
      - depanmagic-pg:/var/lib/postgresql/data
      - ./ai-agent/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depanmagic -d depanmagic"]
      interval: 5s
      timeout: 3s
      retries: 10

  postfix:
    image: boky/postfix:latest
    container_name: depanmagic-postfix
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: depanmagic.fr
      RELAYHOST: ${SMTP_RELAY_HOST}
      RELAYHOST_USERNAME: ${SMTP_RELAY_USER}
      RELAYHOST_PASSWORD: ${SMTP_RELAY_PASSWORD}
    ports:
      - "127.0.0.1:25:25"

volumes:
  asterisk-spool:
  asterisk-logs:
  depanmagic-pg:
