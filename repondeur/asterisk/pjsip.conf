; =============================================================================
; PJSIP - Trunk SIP OVH pour DEPANMAGIC
; =============================================================================
; Remplir les variables ${OVH_*} via envsubst au démarrage du conteneur.
; Documentation OVH : https://docs.ovh.com/fr/telephony/
; =============================================================================

[global]
type=global
user_agent=DEPANMAGIC-IVR
endpoint_identifier_order=username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

; -----------------------------------------------------------------------------
; Trunk OVH - Registration auprès de sip.ovh.fr
; -----------------------------------------------------------------------------
[ovh-trunk]
type=registration
transport=transport-udp
outbound_auth=ovh-auth
server_uri=sip:sip.ovh.fr
client_uri=sip:${OVH_SIP_USERNAME}@sip.ovh.fr
contact_user=${OVH_SIP_USERNAME}
retry_interval=60
forbidden_retry_interval=300
expiration=3600

[ovh-auth]
type=auth
auth_type=userpass
username=${OVH_SIP_USERNAME}
password=${OVH_SIP_PASSWORD}

[ovh-aor]
type=aor
contact=sip:sip.ovh.fr
qualify_frequency=60

[ovh-endpoint]
type=endpoint
transport=transport-udp
context=from-ovh
disallow=all
allow=alaw
allow=ulaw
outbound_auth=ovh-auth
aors=ovh-aor
from_user=${OVH_SIP_USERNAME}
from_domain=sip.ovh.fr
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
language=fr

[ovh-identify]
type=identify
endpoint=ovh-endpoint
match=sip.ovh.fr

; -----------------------------------------------------------------------------
; Extension interne 100 - poste du gérant / technicien (softphone Linphone, Zoiper...)
; -----------------------------------------------------------------------------
[100]
type=endpoint
context=internal
disallow=all
allow=alaw
allow=ulaw
auth=100-auth
aors=100-aor
direct_media=no
language=fr
mailboxes=100@depanmagic

[100-auth]
type=auth
auth_type=userpass
username=100
password=${EXT_100_PASSWORD}

[100-aor]
type=aor
max_contacts=2
qualify_frequency=60
