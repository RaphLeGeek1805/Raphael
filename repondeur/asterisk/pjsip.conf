; =============================================================================
; PJSIP - Asterisk en réception d'appels OVH Contact Center Solution
; =============================================================================
; Architecture Option A :
;   PSTN → OVH CCS (n° 0033184162110) → menu 1-4 dans l'UI OVH ;
;   sur la touche 0, OVH CCS fait un "transfert externe SIP" vers cet Asterisk
;   qui exécute l'AGI Claude.
;
; Notre Asterisk n'est PAS enregistré chez OVH (pas de registration sortante).
; Il accepte uniquement les INVITE entrants en provenance des plages IP du CCS.
; =============================================================================

[global]
type=global
user_agent=DEPANMAGIC-AI
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}

; -----------------------------------------------------------------------------
; Endpoint pour les appels venant d'OVH Contact Center Solution.
; Identification par IP source (pas d'auth digest fournie par OVH CCS sur les
; transferts externes). Vérifier les plages IP dans :
;   Manager OVH → VoIP → votre ligne → Configuration → IP autorisées
; ou : https://docs.ovh.com/fr/telephony/api-events-cdr/  (chercher "IP CCS").
; Mettre la liste séparée par des virgules dans OVH_CCS_ALLOWED_IPS.
; -----------------------------------------------------------------------------
[ovh-ccs]
type=endpoint
transport=transport-udp
context=from-ovh-ccs
disallow=all
allow=alaw
allow=ulaw
allow=opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
language=fr
ice_support=no
trust_id_inbound=yes

[ovh-ccs-identify]
type=identify
endpoint=ovh-ccs
match=${OVH_CCS_ALLOWED_IPS}

; -----------------------------------------------------------------------------
; Extension interne 100 — utile pour tests locaux (softphone Linphone, Zoiper).
; Permet de composer 100 depuis un poste enregistré pour déclencher l'AGI
; Claude sans passer par OVH CCS, et de faire de la recette en local.
; -----------------------------------------------------------------------------
[100]
type=endpoint
context=internal-test
disallow=all
allow=alaw
allow=ulaw
auth=100-auth
aors=100-aor
direct_media=no
language=fr

[100-auth]
type=auth
auth_type=userpass
username=100
password=${EXT_100_PASSWORD}

[100-aor]
type=aor
max_contacts=2
qualify_frequency=60
