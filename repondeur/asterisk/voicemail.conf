; =============================================================================
; Messagerie vocale DEPANMAGIC
; =============================================================================
; Les messages laissés sont envoyés par e-mail en pièce jointe (.wav).
; Format MAILBOX => password,nom complet,email,pager,options
; =============================================================================

[general]
format=wav49|gsm|wav
serveremail=repondeur@depanmagic.fr
attach=yes
maxmsg=100
maxsecs=180
minsecs=2
maxlogins=3
moveheard=yes
emaildateformat=%A %d %B %Y à %H:%M:%S
emailsubject=[DEPANMAGIC] Nouveau message vocal de ${VM_CALLERID}
emailbody=Bonjour,\n\nVous avez reçu un nouveau message vocal sur la ligne DEPANMAGIC.\n\nDe       : ${VM_CALLERID}\nBoîte    : ${VM_MAILBOX} (${VM_NAME})\nDurée    : ${VM_DUR}\nDéposé le: ${VM_DATE}\n\nLe fichier audio est joint à ce mail.\n\n-- \nRépondeur automatique DEPANMAGIC
charset=UTF-8
language=fr
tz=europe-paris
sendvoicemail=yes

[zonemessages]
europe-paris=Europe/Paris|'envoyé' Q 'à' HM

; -----------------------------------------------------------------------------
; Boîtes vocales DEPANMAGIC
; -----------------------------------------------------------------------------
[depanmagic]
100 => ${VM_PIN_100},Accueil DEPANMAGIC,${VM_EMAIL_ACCUEIL},,attach=yes|tz=europe-paris|saycid=yes|envelope=yes|delete=no
101 => ${VM_PIN_101},Demandes de devis,${VM_EMAIL_DEVIS},,attach=yes|tz=europe-paris|saycid=yes|envelope=yes|delete=no
102 => ${VM_PIN_102},Suivi de dossier,${VM_EMAIL_SUIVI},,attach=yes|tz=europe-paris|saycid=yes|envelope=yes|delete=no
103 => ${VM_PIN_103},Urgences (technicien injoignable),${VM_EMAIL_URGENCE},,attach=yes|tz=europe-paris|saycid=yes|envelope=yes|delete=no
