; =============================================================================
; DIALPLAN - Répondeur vocal / IVR DEPANMAGIC
; =============================================================================

[general]
static=yes
writeprotect=no
autofallthrough=yes

[globals]
COMPANY=DEPANMAGIC
TECH_MOBILE=${TECH_MOBILE}        ; numéro mobile du technicien d'astreinte (format E.164, ex: 33612345678)
OPENING_HOUR=8                    ; heure d'ouverture (24h)
CLOSING_HOUR=19                   ; heure de fermeture (24h)

; -----------------------------------------------------------------------------
; Contexte d'arrivée des appels depuis le trunk OVH
; -----------------------------------------------------------------------------
[from-ovh]
exten => _X.,1,NoOp(Appel entrant DEPANMAGIC depuis ${CALLERID(num)})
 same => n,Set(CDR(userfield)=ovh-inbound)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Goto(ivr-main,s,1)

; Fallback : tout appel non identifié
exten => _.,1,Goto(ivr-main,s,1)

; -----------------------------------------------------------------------------
; Vérification des heures d'ouverture
; Lun-Ven 8h-19h, Sam 9h-12h => ouvert ; sinon fermé
; -----------------------------------------------------------------------------
[hours-check]
exten => s,1,NoOp(Vérification horaires)
 same => n,GotoIfTime(08:00-19:00,mon-fri,*,*?open)
 same => n,GotoIfTime(09:00-12:00,sat,*,*?open)
 same => n,Goto(closed)
 same => n(open),Return()
 same => n(closed),Goto(ivr-closed,s,1)

; -----------------------------------------------------------------------------
; Menu principal IVR
; -----------------------------------------------------------------------------
[ivr-main]
exten => s,1,NoOp(== IVR DEPANMAGIC ==)
 same => n,Set(TIMEOUT(digit)=4)
 same => n,Set(TIMEOUT(response)=8)
 same => n,Gosub(hours-check,s,1)
 same => n,Background(custom/depanmagic-welcome)   ; "Bienvenue chez DEPANMAGIC..."
 same => n,Background(custom/depanmagic-menu)      ; "Tapez 1 pour... 2 pour... etc."
 same => n,WaitExten(8)
 same => n,Goto(timeout,1)

; Option 1 : Urgence - transfert vers le mobile du technicien
exten => 1,1,NoOp(Option 1 - Urgence)
 same => n,Playback(custom/depanmagic-urgence-transfer)
 same => n,Dial(PJSIP/${TECH_MOBILE}@ovh-endpoint,30,g)
 same => n,Goto(voicemail-urgence,1)

; Option 2 : Devis - laisser un message
exten => 2,1,NoOp(Option 2 - Devis)
 same => n,Playback(custom/depanmagic-devis-intro)
 same => n,VoiceMail(101@depanmagic,su)
 same => n,Hangup()

; Option 3 : Suivi de dossier - laisser un message
exten => 3,1,NoOp(Option 3 - Suivi)
 same => n,Playback(custom/depanmagic-suivi-intro)
 same => n,VoiceMail(102@depanmagic,su)
 same => n,Hangup()

; Option 4 : Horaires et coordonnées (info uniquement)
exten => 4,1,NoOp(Option 4 - Infos)
 same => n,Playback(custom/depanmagic-horaires)
 same => n,Goto(ivr-main,s,2)

; Option 0 : Conseiller - transfert vers extension interne 100, sinon messagerie
exten => 0,1,NoOp(Option 0 - Conseiller)
 same => n,Playback(custom/depanmagic-transfer-conseiller)
 same => n,Dial(PJSIP/100,25,g)
 same => n,VoiceMail(100@depanmagic,su)
 same => n,Hangup()

; Touche # : répéter le menu
exten => #,1,Goto(ivr-main,s,2)

; Saisie invalide
exten => i,1,Playback(custom/depanmagic-invalide)
 same => n,Goto(ivr-main,s,2)

; Timeout sans saisie
exten => t,1,Playback(custom/depanmagic-timeout)
 same => n,Goto(timeout,1)

exten => timeout,1,VoiceMail(100@depanmagic,su)
 same => n,Hangup()

exten => voicemail-urgence,1,Playback(custom/depanmagic-urgence-vm)
 same => n,VoiceMail(103@depanmagic,su)
 same => n,Hangup()

; -----------------------------------------------------------------------------
; IVR fermé (hors horaires)
; -----------------------------------------------------------------------------
[ivr-closed]
exten => s,1,NoOp(== Hors horaires ==)
 same => n,Background(custom/depanmagic-ferme)
 same => n,Set(TIMEOUT(digit)=4)
 same => n,Set(TIMEOUT(response)=6)
 same => n,WaitExten(6)
 same => n,VoiceMail(100@depanmagic,su)
 same => n,Hangup()

; Urgence 24/7 même hors horaires
exten => 1,1,Goto(ivr-main,1,1)

; Laisser un message
exten => 9,1,VoiceMail(100@depanmagic,su)
 same => n,Hangup()

exten => i,1,Goto(s,1)
exten => t,1,VoiceMail(100@depanmagic,su)
 same => n,Hangup()

; -----------------------------------------------------------------------------
; Contexte interne (postes internes pour consulter la messagerie, etc.)
; -----------------------------------------------------------------------------
[internal]
; Consulter sa messagerie : composer *98
exten => *98,1,VoiceMailMain(${CALLERID(num)}@depanmagic)
 same => n,Hangup()

; Appels internes entre postes
exten => _1XX,1,Dial(PJSIP/${EXTEN},25)
 same => n,VoiceMail(${EXTEN}@depanmagic,su)
 same => n,Hangup()

; Appels sortants via OVH (préfixe 0 + numéro français)
exten => _0XXXXXXXXX,1,Dial(PJSIP/${EXTEN}@ovh-endpoint,60,g)
 same => n,Hangup()
