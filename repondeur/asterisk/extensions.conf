; =============================================================================
; DIALPLAN — Asterisk en mode "back-end IA" derrière OVH CCS
; =============================================================================
; Le menu 1-4, les horaires, la voicemail des autres options sont gérés par
; OVH Contact Center Solution dans l'interface web (Menus interactifs / Files /
; Créneaux exceptionnels). Ne reste ici que la prise en main de l'appel
; redirigé sur la touche 0 par OVH CCS, qui exécute l'AGI Claude.
; =============================================================================

[general]
static=yes
writeprotect=no
autofallthrough=yes

[globals]
COMPANY=DEPAN MAGIC
TECH_MOBILE=${TECH_MOBILE}
OVH_URGENCE_REFER_URI=${OVH_URGENCE_REFER_URI}

; -----------------------------------------------------------------------------
; Contexte d'arrivée des appels transférés par OVH CCS (touche 0 du menu).
; Toute extension matchée tombe sur l'AGI Claude — quel que soit le numéro
; reçu dans l'INVITE.
; -----------------------------------------------------------------------------
[from-ovh-ccs]
exten => _X.,1,NoOp(Appel CCS sur ${EXTEN}, caller=${CALLERID(num)})
 same => n,Set(CDR(userfield)=ovh-ccs-ai)
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,Goto(ai-conseiller,s,1)

; Sécurité : tout pattern non géré tombe aussi sur l'AGI (CCS peut envoyer
; n'importe quel numéro selon la config).
exten => _.,1,Goto(ai-conseiller,s,1)

; -----------------------------------------------------------------------------
; Conseiller IA (AGI Claude)
; -----------------------------------------------------------------------------
[ai-conseiller]
exten => s,1,NoOp(== AGI conseiller IA DEPAN MAGIC ==)
 same => n,Set(AI_HANDOFF=)
 same => n,AGI(ai_conseiller.py)
 same => n,GotoIf($["${AI_HANDOFF}" = "URGENCE"]?urgence:fin)

 ; Branche urgence : Claude a détecté une situation critique.
 ; Deux scénarios selon ce que vous avez configuré côté OVH :
 ;   1. OVH_URGENCE_REFER_URI est défini → on demande à OVH CCS, via SIP REFER,
 ;      de rediriger l'appel (typiquement vers une étape CCS qui appelle le
 ;      mobile d'astreinte ; à configurer dans le menu interactif OVH).
 ;   2. Sinon, fallback : on raccroche après une annonce demandant à l'appelant
 ;      de rappeler et taper 1 pour tomber sur l'astreinte.
 same => n(urgence),NoOp(URGENCE détectée par l'IA)
 same => n,GotoIf($["${OVH_URGENCE_REFER_URI}" = ""]?urgence-fallback)
 same => n,Transfer(${OVH_URGENCE_REFER_URI})
 same => n,Hangup()

 ; Pas de fichier audio statique : Claude a déjà dit le message d'urgence dans
 ; sa dernière réponse (cf. system prompt → "[[TRANSFER_URGENCE]]"). On raccroche.
 same => n(urgence-fallback),Hangup()

 same => n(fin),Hangup()

; -----------------------------------------------------------------------------
; Contexte interne pour tests locaux (softphone enregistré sur l'extension 100).
; Composer "9" depuis le softphone pour atteindre l'agent IA sans passer par OVH.
; -----------------------------------------------------------------------------
[internal-test]
exten => 9,1,Goto(ai-conseiller,s,1)

; Composer *98 pour tester un transfert REFER vers le numéro de mobile
exten => *97,1,Set(AI_HANDOFF=URGENCE)
 same => n,Goto(ai-conseiller,urgence,1)
